# Render Blueprint for COW PRO (Dairy Membrane Processing Design & Simulation Platform)
# Deploy at: https://dashboard.render.com/blueprints

databases:
  - name: cowpro-db
    databaseName: cowpro
    user: cowpro_user
    plan: free

services:
  - type: web
    name: cowpro-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EXPOSE_DEV_TOKENS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cowpro-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.onrender\.com

  - type: web
    name: cowpro-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: BACKEND_URL
        fromService:
          type: web
          name: cowpro-api
          envVarKey: RENDER_EXTERNAL_URL
